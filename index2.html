<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二試験ページ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #173b2a 0%, #06110b 75%);
            color: #e5f5eb;
            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                Meiryo,
                sans-serif;
        }

        .container {
            width: min(900px, 90%);
            padding: 70px 50px;
            text-align: center;
            border: 1px solid #4f8064;
            background: rgba(5, 18, 11, 0.94);
            box-shadow:
                0 0 0 8px rgba(120, 220, 150, 0.02),
                0 25px 80px rgba(0, 0, 0, 0.7);
        }

        .classification {
            display: inline-block;
            padding: 7px 24px;
            margin-bottom: 35px;
            border: 1px solid #5b9170;
            color: #a8cdb4;
            font-size: 12px;
            letter-spacing: 0.25em;
        }

        .title {
            margin: 0;
            font-size: clamp(40px, 8vw, 78px);
            font-weight: 300;
            letter-spacing: 0.18em;
        }

        .subtitle {
            margin-top: 18px;
            color: #7fa88d;
            font-size: 13px;
            letter-spacing: 0.15em;
        }

        .line {
            width: 100px;
            height: 1px;
            margin: 45px auto;
            background: #6da17d;
        }

        .message {
            font-size: 25px;
            letter-spacing: 0.12em;
            font-weight: 500;
        }

        .description {
            margin-top: 22px;
            color: #8eaf99;
            font-size: 15px;
            letter-spacing: 0.08em;
        }

        .status {
            margin-top: 50px;
            padding: 18px;
            border-top: 1px solid #294d36;
            border-bottom: 1px solid #294d36;
            color: #86a591;
            font-size: 13px;
            letter-spacing: 0.12em;
        }

        .status span {
            color: #c5e6ce;
        }

        footer {
            margin-top: 35px;
            color: #52705b;
            font-size: 11px;
            letter-spacing: 0.15em;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            border: 1px solid #5b9170;
            background: transparent;
            color: #c5e6ce;
            text-decoration: none;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #c5e6ce;
            color: #06110b;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            border: 1px solid #5b9170;
            color: #c5e6ce;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.12em;
            transition: 0.2s;
        }

        .button:hover {
            background: #c5e6ce;
            color: #06110b;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="classification">
            第二段階・試験用ページ
        </div>

        <h1 class="title">成功</h1>

        <div class="subtitle">
            次のページまで正常に到達しました
        </div>

        <div class="line"></div>

        <div class="message">
            すごい！
        </div>

        <div class="description">
            すごい！
        </div>

        <div class="status">
            現在の状態：
            <span>ALL GREEN</span>
        </div>

        <footer>
            かきくけこ
            <br><br>

            <button id="colorButton" class="button">
                ページの色を変える
            </button>

            <br>

            <a href="index.html" class="button">
                前のページへ戻る
            </a>
        </footer>

    </main>

    <script>
        const backgrounds = [
            "radial-gradient(circle at center, #3b2020 0%, #110606 75%)",
            "radial-gradient(circle at center, #173b2a 0%, #06110b 75%)",
            "radial-gradient(circle at center, #2b1b38 0%, #0d0712 75%)",
            "radial-gradient(circle at center, #202838 0%, #080b10 75%)"
        ];

        let backgroundIndex = 1;

        document.getElementById("colorButton").addEventListener("click", function () {
            backgroundIndex++;

            if (backgroundIndex >= backgrounds.length) {
                backgroundIndex = 0;
            }

            document.body.style.background = backgrounds[backgroundIndex];
        });
    </script>
</body>
</html>
