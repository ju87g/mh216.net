<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備忘録セット</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #202838 0%, #080b10 75%);
            color: #e8edf5;
            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                Meiryo,
                sans-serif;
        }

        .container {
            width: min(900px, 90%);
            padding: 60px 40px;
            text-align: center;
            border: 1px solid #596579;
            background: rgba(10, 15, 24, 0.94);
            box-shadow:
                0 0 0 8px rgba(255,255,255,0.02),
                0 25px 80px rgba(0,0,0,0.65);
        }

        .classification {
            display: inline-block;
            padding: 7px 24px;
            margin-bottom: 25px;
            border: 1px solid #768397;
            color: #aeb9c9;
            font-size: 12px;
            letter-spacing: 0.25em;
        }

        .title {
            margin: 0;
            font-size: clamp(32px, 6vw, 60px);
            font-weight: 300;
            letter-spacing: 0.2em;
        }

        .subtitle {
            margin-top: 15px;
            color: #8793a5;
            font-size: 13px;
            letter-spacing: 0.18em;
        }

        .line {
            width: 100px;
            height: 1px;
            margin: 35px auto;
            background: #8d9aae;
        }

        /* ボタンを綺麗に並べるエリア */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-button {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #768397;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.02);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.15em;
            transition: 0.2s;
        }

        .menu-button:hover {
            background: #cbd5e1;
            color: #080b10;
        }

        /* ダミーボタン用のスタイル（少し控えめな見た目） */
        .menu-button.dummy {
            border-color: #3e4a5c;
            color: #7b889b;
        }

        .menu-button.dummy:hover {
            background: #3e4a5c;
            color: #e8edf5;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #768397;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.15em;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="classification">
            MEMO INDEX
        </div>

        <h1 class="title">BIBOUROKU</h1>

        <div class="subtitle">
            備忘録および各種ドキュメント一覧
        </div>

        <div class="line"></div>

        <!-- ボタンリスト -->
        <div class="button-group">
            <!-- メインのDocker用備忘録ボタン -->
            <a href="bibourokudocker.html" class="menu-button">
                Docker/FileBrowser Ubuntu
            </a>

            <a href="docker+python.html" class="menu-button">
                Docker/Python Ubuntu
            </a>

            <!-- ダミーボタン 1～3 -->
            
            <a href="#" class="menu-button dummy" onclick="alert('準備中のダミーボタンです'); return false;">
                ダミー項目 02（準備中）
            </a>
            <a href="#" class="menu-button dummy" onclick="alert('準備中のダミーボタンです'); return false;">
                ダミー項目 03（準備中）
            </a>
        </div>

        <div>
            <a href="index.html" class="back-link">
                ← 最初のページに戻る
            </a>
        </div>

    </main>

</body>
</html>
